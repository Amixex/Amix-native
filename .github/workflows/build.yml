name: Build APK (model inside)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Нужно, чтобы выложить готовый APK в раздел Releases
permissions:
  contents: write

env:
  # Модель, которая вшивается в APK. Чтобы взять другую, замените ссылку
  # (имя файла должно заканчиваться на .task).
  MODEL_URL: "https://huggingface.co/litert-community/Qwen2.5-1.5B-Instruct/resolve/main/Qwen2.5-1.5B-Instruct_multi-prefill-seq_q8_ekv1280.task"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Кэш, чтобы не скачивать модель при каждой сборке
      - name: Restore model cache
        id: modelcache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/amix-model.task
          key: model-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Download model into app assets
        if: steps.modelcache.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p app/src/main/assets
          AUTH=""
          if [ -n "${HF_TOKEN}" ]; then AUTH="Authorization: Bearer ${HF_TOKEN}"; fi
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
            ${AUTH:+-H "$AUTH"} \
            -o app/src/main/assets/amix-model.task "$MODEL_URL"

      - name: Check model file
        run: |
          SIZE=$(stat -c%s app/src/main/assets/amix-model.task)
          echo "Размер модели: $((SIZE/1048576)) МБ"
          if [ "$SIZE" -lt 300000000 ]; then
            echo "::error::Модель не скачалась (файл слишком маленький). Проверьте MODEL_URL и доступ."
            exit 1
          fi

      # Ставит Gradle 8.9 сам: сборка работает даже без gradlew и gradle-wrapper.jar
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      # APK с моделью весит больше 1 ГБ, поэтому кладём его в Releases (файл до 2 ГБ),
      # а не в Artifacts (там слишком маленький лимит хранилища)
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          SIZE=$(stat -c%s "$APK")
          echo "APK: $((SIZE/1048576)) МБ"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "::error::APK больше 2 ГБ, GitHub Releases его не примет. Возьмите модель поменьше (MODEL_URL)."
            exit 1
          fi
          cp "$APK" Amix-offline-debug.apk
          gh release create "build-${{ github.run_number }}" Amix-offline-debug.apk \
            --title "Amix, сборка ${{ github.run_number }} (модель внутри)" \
            --notes "APK с вшитой ИИ-моделью. Скачайте Amix-offline-debug.apk и установите на телефон." \
            --target "${{ github.sha }}"
